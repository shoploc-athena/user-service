spring.application.name=user-service

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/user_lille}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.locations=classpath:db/migration

# Security (JWT) - values come from the environment (see shoploc-infra/.env.example)
shoploc.city=${CITY:}
shoploc.jwt.secret=${JWT_SECRET:}
shoploc.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
